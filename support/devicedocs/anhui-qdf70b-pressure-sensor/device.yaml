# Hand-maintained source of truth for the anhui-qdf70b-pressure-sensor device.
# Edit this file directly; support/converter/convert_all.py runs it through the
# augment library to regenerate
# custom_components/modbus_connect/device_configs/anhui-qdf70b-pressure-sensor.yaml.
#
# Register map: Anhui Qidian "MODBUS Pressure and Level transmitter communication
# protocol" (qidian-pressure-level-sensor-modbus-rtu-protocol.pdf in this folder) —
# the protocol shared by the QDF70B / QDW90A / QDY family. Addresses are 0-based PDU
# addresses (the document's own example frame `01 03 00 04 00 01` reads the value).
# The measured value at register 4 is a signed integer scaled by the decimal-places
# register (3) and expressed in the unit register (2); the unit below assumes the
# factory setting of a QDF70B ordered in Pa with 0 decimals — see caveats.md.

device:
  manufacturer: Anhui
  model: QDF70B Pressure Sensor
  prefix: Anhui Pressure Sensor
  max_register_read: 64
  # The map is sparse (0–12, 22–23, 37); bridge the small holes, but not the
  # undocumented 24–36 run, so the parity register is read on its own.
  max_read_gap: 8
  # basic (the pressure reading) is always on; standard adds the float copy and the
  # unit/decimal setup; the calibration and communication settings are opt-in.
  default_groups: [basic, standard]
  group_labels:
    standard: Standard
    advanced: Advanced
    readings: Readings
    calibration: Calibration
    modbus_config: "Modbus & comms"

holding:
  pressure:
    address: 4
    type: int16
    groups: [basic, readings]
    ha:
      platform: sensor
      name: Pressure
      unit: Pa
      device_class: pressure
      state_class: measurement
  pressure_float:
    address: 22
    type: float32
    groups: [standard, readings]
    ha:
      platform: sensor
      name: Pressure (float)
      unit: Pa
      device_class: pressure
      state_class: measurement
      precision: 1
  pressure_unit:
    address: 2
    groups: [standard, readings]
    map:
      0: MPa
      1: kPa
      2: Pa
      3: bar
      4: mbar
      5: kg/cm²
      6: PSI
      7: mH₂O
      8: mmH₂O
      9: inH₂O
      10: H₂O
      11: mHg
      12: mmHg
      13: inHg
      14: atm
      15: Torr
      16: m
      17: cm
      18: mm
      19: kg
      20: "°C"
      21: pH
      22: "°F"
      23: Empty
    ha:
      platform: sensor
      name: Pressure unit
      icon: "mdi:ruler"
      entity_category: diagnostic
  decimal_places:
    address: 3
    groups: [standard, readings]
    ha:
      platform: sensor
      name: Decimal places
      icon: "mdi:decimal"
      entity_category: diagnostic
  range_zero_point:
    address: 5
    type: int16
    groups: [advanced, calibration]
    ha:
      platform: sensor
      name: Range zero point
      unit: Pa
      device_class: pressure
      icon: "mdi:arrow-collapse-down"
      entity_category: diagnostic
  range_full_point:
    address: 6
    type: int16
    groups: [advanced, calibration]
    ha:
      platform: sensor
      name: Range full point
      unit: Pa
      device_class: pressure
      icon: "mdi:arrow-collapse-up"
      entity_category: diagnostic
  zero_offset:
    address: 12
    type: int16
    groups: [advanced, calibration]
    ha:
      platform: number
      name: Zero offset
      min: -32768
      max: 32767
      step: 1
      unit: Pa
      icon: "mdi:plus-minus-variant"
      entity_category: config
  undocumented_register_9:
    address: 9
    type: int16
    groups: [advanced]
    ha:
      platform: sensor
      name: Undocumented register 9
      icon: "mdi:help-circle-outline"
      entity_category: diagnostic
  modbus_address:
    address: 0
    groups: [advanced, modbus_config]
    ha:
      platform: number
      name: Modbus address
      min: 1
      max: 255
      step: 1
      icon: "mdi:serial-port"
      entity_category: config
  baud_rate:
    address: 1
    groups: [advanced, modbus_config]
    map:
      0: 1200 bps
      1: 2400 bps
      2: 4800 bps
      3: 9600 bps
      4: 19200 bps
      5: 38400 bps
      6: 57600 bps
      7: 115200 bps
    ha:
      platform: select
      name: Modbus baud rate
      icon: "mdi:speedometer"
      entity_category: config
  parity:
    address: 37
    groups: [advanced, modbus_config]
    map:
      0: "None"
      1: Odd
      2: Even
    ha:
      platform: select
      name: Modbus parity
      icon: "mdi:check-network-outline"
      entity_category: config
  save_settings:
    address: 15
    write_value: 0
    groups: [advanced, modbus_config]
    ha:
      platform: button
      name: Save settings
      icon: "mdi:content-save"
      entity_category: config
  restore_factory_settings:
    address: 16
    write_value: 1
    groups: [advanced, modbus_config]
    ha:
      platform: button
      name: Restore factory settings
      device_class: restart
      icon: "mdi:factory"
      entity_category: config

translations:
  QDF70B Pressure Sensor:
    de: QDF70B Drucksensor
    en: QDF70B Pressure Sensor
  Pressure:
    de: Druck
    en: Pressure
  Pressure (float):
    de: Druck (Gleitkomma)
    en: Pressure (float)
  Pressure unit:
    de: Druckeinheit
    en: Pressure unit
  Decimal places:
    de: Dezimalstellen
    en: Decimal places
  Range zero point:
    de: Messbereich Nullpunkt
    en: Range zero point
  Range full point:
    de: Messbereich Endwert
    en: Range full point
  Zero offset:
    de: Nullpunktverschiebung
    en: Zero offset
  Undocumented register 9:
    de: Undokumentiertes Register 9
    en: Undocumented register 9
  Save settings:
    de: Einstellungen speichern
    en: Save settings
  Restore factory settings:
    de: Werkseinstellungen wiederherstellen
    en: Restore factory settings
  Readings:
    de: Messwerte
    en: Readings
  Calibration:
    de: Kalibrierung
    en: Calibration
  Empty:
    de: Leer
    en: Empty
