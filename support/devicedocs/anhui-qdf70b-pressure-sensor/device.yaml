# Hand-maintained source of truth for the anhui-qdf70b-pressure-sensor device.
# Edit this file directly; support/converter/convert_all.py runs it through the
# augment library to regenerate
# custom_components/modbus_connect/device_configs/anhui-qdf70b-pressure-sensor.yaml.
# Started from a support/modbus_scanner skeleton; the two "detail" registers are
# served by the device but their meaning is not documented yet.

device:
  manufacturer: Anhui
  model: QDF70B Pressure Sensor
  prefix: Anhui Pressure Sensor
  max_register_read: 64
  max_read_gap: 32
  # basic (the pressure reading) is always on; the undocumented detail registers
  # are opt-in via the Advanced switch.
  default_groups: [basic]
  group_labels:
    advanced: Advanced

holding:
  pressure_pa:
    address: 4
    groups: [basic]
    ha:
      platform: sensor
      name: Pressure
      unit: Pa
      device_class: pressure
      state_class: measurement
  pressure_detail_2:
    address: 22
    groups: [advanced]
    ha:
      platform: sensor
      name: Pressure detail 2
      state_class: measurement
  pressure_detail_1:
    address: 9
    type: int16
    groups: [advanced]
    ha:
      platform: sensor
      name: Pressure detail 1
      state_class: measurement

translations:
  QDF70B Pressure Sensor:
    de: QDF70B Drucksensor
    en: QDF70B Pressure Sensor
  Pressure:
    de: Druck
    en: Pressure
  Pressure detail 1:
    de: Druck Detail 1
    en: Pressure detail 1
  Pressure detail 2:
    de: Druck Detail 2
    en: Pressure detail 2
